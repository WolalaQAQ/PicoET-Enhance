# PICO expression postprocessing, read once when the payload starts.
# Adjust in the PicoET-Enhance companion app, or install with:
# bin/picoet-config write < postprocessing-default.conf
# Strength: 0 bypasses a stage, 1 retains the original amount; fractional values mix.
# enabled: 0 bypasses this entire region, 1 enables its stages.
# Source clocks, quality/validity, calibration, reference images and final [0,1]
# bounds remain in force. These are expression-model values, not raw pixels.
version=1
eye.enabled=1
eye.brow_curve.strength=1
