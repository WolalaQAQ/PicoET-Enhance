[package]
name = "picoet-pc-studio"
version = "2.6.2-dev.1"
description = "PicoET-Enhance PC Studio whole-mouth inference, capture, and Cymple eye relay"
license = "MIT"
edition = "2021"
rust-version = "1.92"

[lib]
name = "picoet_pc_studio_lib"
crate-type = ["rlib"]

[[bin]]
name = "PicoET-PC-Studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17", "directml", "cuda", "openvino"] }
rfd = { version = "0.18", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
